<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Semantic Search</title>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;max-width:1000px;margin:0 auto;padding:40px 24px;background:#f5f7fb;color:#1f2937}
    .card{background:#fff;padding:32px;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    nav{margin-bottom:24px}nav a{margin-right:16px;text-decoration:none;color:#2563eb;font-weight:600}
    .row{display:flex;gap:10px;margin-top:24px}input{flex:1;padding:12px;border:1px solid #d1d5db;border-radius:8px}button{border:0;border-radius:8px;padding:12px 18px;background:#2563eb;color:#fff;cursor:pointer}
    .result{padding:18px;margin-top:18px;border:1px solid #e5e7eb;border-radius:10px;background:#fafafa}.score{font-weight:600;color:#2563eb}.headline{font-size:18px;font-weight:700}.location{color:#6b7280;margin:6px 0 10px}
  </style>
</head>
<body>
<nav><a href="/">Sync Weather</a><a href="/search">Semantic Search</a></nav>
<div class="card">
  <h1>Weather Semantic Search</h1>
  <p>Search forecasts and alerts using natural language.</p>
  <div class="row"><input id="query" value="flash flood risk this weekend"><button onclick="searchWeather()">Search</button></div>
  <p id="status"></p><div id="results"></div>
</div>
<script>
const esc=v=>{const d=document.createElement('div');d.textContent=v??'';return d.innerHTML};
async function searchWeather(){
  const q=document.getElementById('query').value.trim(),status=document.getElementById('status'),container=document.getElementById('results');container.innerHTML='';if(!q){status.textContent='Enter a query.';return}status.textContent='Searching...';
  try{const r=await fetch('/weather/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:q,top_k:5})});const data=await r.json();if(!r.ok){status.textContent=data.error||'Search failed';return}const results=data.results||[];status.textContent=`Found ${results.length} results`;results.forEach(x=>{container.insertAdjacentHTML('beforeend',`<div class="result"><div class="headline">${esc(x.headline||'Weather Update')}</div><div class="location">${esc(x.location)} · ${esc(x.source_type)}</div><div class="score">Similarity: ${Number(x.similarity).toFixed(3)}</div><p>${esc(x.chunk_text)}</p></div>`)})}catch(e){status.textContent='Search failed: '+e}
}
document.getElementById('query').addEventListener('keydown',e=>{if(e.key==='Enter')searchWeather()});
</script>
</body>
</html>
